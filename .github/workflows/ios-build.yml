name: Blockside Java Edition iOS build

permissions:
  contents: read

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Check out Blockside and engine sources
        uses: actions/checkout@v4

      - name: Set up Java 8 build toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install native build tools
        run: brew install cmake ldid make wget

      - name: Build iOS Java Edition launcher
        run: |
          cd Engine/PojavLegacy
          export BOOTJDK="$JAVA_HOME/bin"
          gmake -j2 JOBS=2 RELEASE=1 package PLATFORM=2 BRANCH="$GITHUB_REF_NAME" COMMIT="$(git rev-parse --short HEAD)"
          cp artifacts/net.kdt.pojavlauncher-2.2-ios.ipa "$GITHUB_WORKSPACE/Blockside-Java-Edition.ipa"

      - name: Upload iOS device IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blockside-Java-Edition-iOS-12.2
          path: Blockside-Java-Edition.ipa
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download device IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: Blockside-Java-Edition-iOS-12.2

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Blockside ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: Blockside-Java-Edition.ipa
