name: Feature request
description: Suggest an improvement to Blockside.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Device or compatibility constraints
      description: Include iOS version and device model if relevant.
