name: Bug report
description: Report a reproducible issue with Blockside.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, account tokens, private world data, or full unredacted logs."
  - type: input
    id: build
    attributes:
      label: Blockside build or release
      placeholder: e.g. v0.1.0 or Actions run date
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: e.g. iPhone 8, iOS 15.8
    validations:
      required: true
  - type: input
    id: game-version
    attributes:
      label: Minecraft version selected
      placeholder: e.g. 1.20.4
  - type: textarea
    id: jit
    attributes:
      label: JIT and install method
      description: State the sideloading method and whether JIT was enabled.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: What did you tap or select before the issue?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Remove usernames, tokens, world names, and server addresses.
